name: Nightly security scan

on:
  schedule:
    # 08:00 UTC daily — roughly 01:00 PT
    - cron: "0 8 * * *"
  workflow_dispatch:

# CVE scanning of Gemfile.lock is handled by Dependabot alerts
# (see .github/dependabot.yml). This workflow covers static analysis
# that Dependabot doesn't do.

jobs:
  brakeman:
    name: Backend / Brakeman
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager --exit-on-warn --quiet
