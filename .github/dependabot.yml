version: 2
updates:
  # Rails backend gems
  - package-ecosystem: bundler
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle minor/patch bumps together to keep PR noise down.
      # Majors still open their own PR so they get a proper review.
      rails-ecosystem:
        patterns:
          - "rails"
          - "rails-*"
          - "action*"
          - "active*"
          - "rail*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep GitHub Actions versions fresh (minor/patch only — major bumps need manual review)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
